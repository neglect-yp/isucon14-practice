worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    log_format alp escape=json
        '{"time":"$time_iso8601","msec":$msec,"method":"$request_method",'
        '"uri":"$request_uri","status":$status,"body_bytes":$body_bytes_sent,'
        '"response_time":$request_time,"upstream_response_time":"$upstream_response_time",'
        '"user_agent":"$http_user_agent"}';
    access_log /dev/stdout alp;

    upstream rust {
        server webapp:8080;
        keepalive 64;
    }

    server {
        listen 80;
        client_max_body_size 10m;
        location / {
            proxy_pass http://rust;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }
    }
}
